<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sana küçük bir şey</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #111;
      color: #f3efe8;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 700px;
      padding: 40px 20px;
    }

    h1 {
      font-size: clamp(2.2rem, 7vw, 4rem);
      font-weight: 400;
      margin-bottom: 25px;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.8;
      color: #cfc8bd;
      margin-bottom: 35px;
    }

    button {
      background: transparent;
      border: 1px solid #777;
      color: #f3efe8;
      padding: 14px 30px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #f3efe8;
      color: #111;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div id="intro">
      <h1>Sana küçük bir şey hazırladım.</h1>

      <p>
        Bunu anlatmanın en doğru yolunu bulamadım.<br>
        O yüzden sana küçük bir yer hazırlamak istedim.
      </p>

      <button onclick="showMessage()">
        Devam et →
      </button>
    </div>

    <div id="message" class="hidden">
      <h1>Burada söylemek istediğim birkaç şey var.</h1>

      <p>
        Acelemiz yok.<br>
        Sadece birkaç dakika ayırman yeterli.
      </p>
    </div>

  </div>

  <script>
    function showMessage() {
      document.getElementById("intro").classList.add("hidden");
      document.getElementById("message").classList.remove("hidden");
    }
  </script>

</body>
</html>
